name: smd-drift
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11
  - pip
  # Geospatial, Oceanographic & C-bound Libraries
  - gdal>=3.6.0
  - geos>=3.11.0
  - proj>=9.1.0
  - netcdf4>=1.6.0
  - xarray>=2023.1.0
  - rasterio>=1.3.0
  - cartopy>=0.22.0
  - scipy>=1.10.0
  - numpy>=1.24.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  # Core Lagrangian Particle Frameworks
  - opendrift>=1.11.0
  # Machine Learning & Survival Analysis
  - scikit-learn>=1.3.0
  - xgboost>=2.0.0
  - lifelines>=0.28.0
  - networkx>=3.0
  - pydantic>=2.0.0
  - pytest>=7.4.0
  # PyTorch Ecosystem
  - pytorch>=2.1.0
  - pip:
      - torchdyn>=1.0.6
      - torch_geometric>=2.4.0
